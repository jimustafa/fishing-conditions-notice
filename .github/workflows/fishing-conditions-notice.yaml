name: Fishing Conditions Notice

on:
  schedule:
    - cron: "0 23 * * 2,5"  # Tue/Fri 4pm PDT (UTC-7); 3pm PST (UTC-8)
  workflow_dispatch:
    inputs:
      email_to:
        description: "Recipient(s)"
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      UV_SYSTEM_PYTHON: 1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv pip install -r requirements/requirements.txt

      - name: Send notification
        env:
          LOCATION: ${{ vars.LOCATION }}
          AQUALINK_SITE_ID: ${{ vars.AQUALINK_SITE_ID }}
          WATER_TEMPERATURE_THRESHOLD: ${{ vars.WATER_TEMPERATURE_THRESHOLD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ inputs.email_to || secrets.EMAIL_TO }}
        run: |
          DAY=$(date -u +%u)  # 1=Mon … 2=Tue … 5=Fri … 7=Sun
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run scripts/fishing-conditions-notice.py --output artifacts/fishing-conditions.html
          elif [ "$DAY" = "5" ]; then
            uv run scripts/fishing-conditions-notice.py --output artifacts/fishing-conditions.html
          elif [ "$DAY" = "2" ]; then
            uv run scripts/fishing-conditions-notice.py --water-temperature-threshold "${{ vars.WATER_TEMPERATURE_THRESHOLD }}" --output artifacts/fishing-conditions.html
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts/
          if-no-files-found: ignore
